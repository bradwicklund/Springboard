[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "olist_e_commerce_analysis"
version = "0.0.1"
description = "This project uses the Olist e-commerce dataset to identify high-value customer segments through RFM-based clustering and predict customer satisfaction with regression modeling. By combining segmentation and predictive insights, it aims to help Olist improve retention and target its most valuable customers."
authors = [
  { name = "Brad Wicklund" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "==3.12.7"

[tool.black]
line-length = 99
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
)/
'''

[tool.isort]
profile = "black"
known_first_party = ["olist_e_commerce_analysis"]
force_sort_within_sections = true


